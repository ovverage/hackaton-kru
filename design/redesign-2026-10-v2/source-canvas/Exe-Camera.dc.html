<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Qorgau — проверка камеры</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./qorgau.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2859BC}a:hover{color:#153B83}
</style>
</helmet>
<div class="q win" style="min-height: 760px; font-family: 'Geologica', 'Segoe UI', sans-serif; color: #1D2C47">
  <header class="win-head" style="padding-top: 18px; padding-bottom: 18px">
    <h1 class="t-h2">Проверка камеры</h1>
    <button class="icon-btn" aria-label="Закрыть">
      <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
  </header>

  <main class="win-body" style="gap: 20px">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <label class="select" style="flex: 1 1 260px">
        <span class="sr-only">Камера</span>
        <select class="input"><option>Logitech C270 HD</option><option>Встроенная камера</option></select>
        <svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
      </label>
    </div>

    <figure class="cam" style="border-radius: 12px">
      <svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="640" height="360" fill="#232B39"></rect>
        <rect width="640" height="250" fill="#29313F"></rect>
        <rect x="470" y="40" width="120" height="150" rx="4" fill="#2F3848"></rect>
        <path d="M180 360 C186 292 240 262 320 262 C400 262 454 292 460 360 Z" fill="#485369"></path>
        <rect x="297" y="214" width="46" height="56" rx="14" fill="#424C61"></rect>
        <ellipse cx="320" cy="168" rx="58" ry="70" fill="#56627A"></ellipse>
        <path d="M262 160 C262 110 290 96 320 96 C352 96 378 112 378 160 C366 134 344 126 320 126 C296 126 274 136 262 160 Z" fill="#394358"></path>
        <ellipse cx="320" cy="172" rx="96" ry="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="7 7"></ellipse>
      </svg>
      <span class="reg light tl"></span><span class="reg light tr"></span><span class="reg light bl"></span><span class="reg light br"></span>
      <span class="tc" style="left: 24px; top: 22px; bottom: auto; display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7FA2E8"></span>Камера включена</span>
    </figure>

    <ol style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <li style="display: flex; gap: 12px; align-items: flex-start"><span class="bub-num done">1</span><span style="padding-top: 4px"><strong style="display: block; font-weight: 600">Лицо в овале</strong><span class="t-small">Свет спереди, не сзади</span></span></li>
      <li style="display: flex; gap: 12px; align-items: flex-start"><span class="bub-num now">2</span><span style="padding-top: 4px"><strong style="display: block; font-weight: 600">Посмотрите на экран</strong><span class="t-small">Qorgau запомнит позу</span></span></li>
      <li style="display: flex; gap: 12px; align-items: flex-start"><span class="bub-num">3</span><span style="padding-top: 4px"><strong style="display: block; font-weight: 600">Нажмите кнопку</strong><span class="t-small">Больше ничего не нужно</span></span></li>
    </ol>
    <p class="t-small" style="display: inline-flex; align-items: center; gap: 6px"><svg class="i s" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Изображение остаётся на этом компьютере. Звук не записывается.</p>
  </main>

  <footer class="modal-foot" style="justify-content: space-between">
    <button class="btn">Отмена</button>
    <a class="btn primary" href="Main.dc.html">
      <svg class="i s" viewBox="0 0 24 24" style="stroke-width: 2.25"><path d="M20 6 9 17l-5-5"></path></svg>
      Использовать эту камеру
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
