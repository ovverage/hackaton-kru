<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ученик: первое подключение</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qorgau.css">
<style>@font-face{font-family:'Geologica';src:url('fonts/Geologica-Variable.woff') format('woff');font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B6474}a:hover{color:#08505D}
</style>
</head>
<body>
<div class="q win" style="min-height: 560px; font-family: 'Geologica', 'Segoe UI', sans-serif; color: #22252B">
  <header class="win-head">
    <span class="brand">
      <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><circle cx="11" cy="12" r="8" fill="#0B6474"></circle><rect x="15.5" y="4" width="4.5" height="20" rx="2.25" fill="#0B6474"></rect></svg>
      Qorgau
    </span>
    <span class="pill off"><span class="bub off"></span>Подключаемся</span>
  </header>

  <main class="win-body" style="justify-content: center; gap: 28px">
    <div style="display: flex; gap: 10px" aria-hidden="true">
      <span class="bub lg on"></span>
      <span class="bub lg on"></span>
      <span class="bub lg" style="border-color: #0B6474"></span>
    </div>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h1 class="t-h1" style="max-width: 17ch">Подключаем компьютер к&nbsp;аудитории</h1>
      <p class="t-lead" style="max-width: 44ch">Вводить ничего не нужно. Как только преподаватель увидит этот компьютер, откроется подготовка к тесту.</p>
    </section>
    <dl style="display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; margin: 0; font-size: 14px">
      <dt class="muted">Компьютер</dt><dd style="margin: 0; font-weight: 600">K301-PC14</dd>
      <dt class="muted">Сервер</dt><dd style="margin: 0">адрес уже встроен в приложение</dd>
    </dl>
    <div>
      <button class="btn" disabled>
        <svg class="i s" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
        Подключаемся…
      </button>
    </div>
  </main>

  <footer class="win-foot">
    <svg class="i s" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect><line x1="2" y1="2" x2="22" y2="22"></line></svg>
    <span>Камера пока выключена. Её включите вы сами на следующем шаге.</span>
  </footer>
</div>
</body>
</html>
