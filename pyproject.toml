[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qostanai-proctor"
version = "0.1.0"
description = "Local proctoring agent and teacher control room"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20", "argon2-cffi>=23"]

[project.scripts]
qorgau-student = "agent.client:main"

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
package = ["pyinstaller>=6.15,<7"]
test = ["pytest>=8,<10"]
cv = ["opencv-python>=4.10,<5", "ultralytics>=8.3,<9", "mediapipe>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "shared*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
