name: Verify and package Qorgau
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install headless Qt and video runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libnss3 libxkbcommon0 libdbus-1-3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 ffmpeg
      - run: python -m pip install -r requirements-core.lock
      - run: python -m pip install -e '.[test,desktop]' opencv-python==4.14.0.94 imageio-ffmpeg==0.6.0 ruff
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check agent backend shared training tests scripts --select E4,E7,E9,F
      - run: npm --prefix web ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Qorgau-Web
          path: web/dist

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - run: python -m pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-windows.lock -e '.[test,desktop,package,cv]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/fetch_models.py
      - run: python -m agent.client --self-test source-selftest.json
      - run: python scripts/build_student.py --with-cv
      - name: Verify the actual packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Qorgau-Student/Qorgau-Student.exe' -ArgumentList '--self-test', "$pwd/packaged-selftest.json" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime check failed' }
          $report = Get-Content packaged-selftest.json | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Packaged report did not pass' }
      - name: Package and checksum
        shell: pwsh
        run: |
          Copy-Item README.md dist/Qorgau-Student/README.md
          Copy-Item docs/SECURITY.md dist/Qorgau-Student/SECURITY.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/Qorgau-Student/THIRD_PARTY_NOTICES.md
          Copy-Item packaged-selftest.json dist/Qorgau-Student/selftest.json
          Compress-Archive -Path dist/Qorgau-Student -DestinationPath Qorgau-Student-Windows-x64.zip
          $hash = (Get-FileHash Qorgau-Student-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Qorgau-Student-Windows-x64.zip" | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Qorgau-Student-Windows-x64
          path: |
            Qorgau-Student-Windows-x64.zip
            SHA256SUMS.txt
            packaged-selftest.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-build-diagnostics
          path: |
            source-selftest.json
            packaged-selftest.json
            build/Qorgau-Student/warn-Qorgau-Student.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Qorgau-Student-Windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Qorgau-Web
          path: web-bundle
      - run: zip -r artifacts/Qorgau-Web.zip web-bundle
      - name: Publish verified hackathon prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --title "Qorgau $GITHUB_REF_NAME · Hackathon" --notes-file docs/RELEASE_NOTES.md
