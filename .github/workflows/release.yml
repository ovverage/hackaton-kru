name: Verify and package Qorgau
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  YOLO_AUTOINSTALL: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install headless Qt and video runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libnss3 libxkbcommon0 libdbus-1-3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 ffmpeg
      - run: python -m pip install -r requirements-core.lock
      - run: python -m pip install -e '.[test,desktop,datasets]' opencv-contrib-python==4.13.0.92 onnxruntime==1.24.3 imageio-ffmpeg==0.6.0 ruff
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check agent backend shared training tests scripts deploy/apply_release.py --select E4,E7,E9,F
      - run: npm --prefix web ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Qorgau-Web
          path: web/dist

  server_face:
    name: server-face
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the server dependencies using binary wheels only
        run: |
          python -m pip install --only-binary=:all: -r requirements-core.lock
          python -m pip check
      - name: Prepare pinned teacher identity assets
        run: python scripts/prepare_teacher_faces.py --folder backend/proctor/assets/teacher-faces
      - name: Verify the backend-only layout and actual CPU models
        run: python scripts/verify_teacher_face_runtime.py --report teacher-face-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: Qorgau-Server-Face-Runtime
          path: teacher-face-runtime.json

  deploy:
    needs: [verify, windows, server_face]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.verify.result == 'success' &&
      needs.server_face.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: qorgau-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip a superseded commit
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on main; skipping this deployment.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: Qorgau-Web
          path: web/dist
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true' && needs.windows.result == 'success'
        with:
          name: Qorgau-Student-Windows-x64
          path: windows-artifacts
      - name: Include the verified Windows executable when built
        if: steps.current.outputs.deploy == 'true' && needs.windows.result == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tomllib
          root = pathlib.Path('windows-artifacts')
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          for name in ('packaged-selftest.json', 'portable-selftest.json', 'installer-selftest.json', 'plain-first-run.json'):
              report = json.loads((root / name).read_text())
              assert report['status'] == 'passed' and report['version'] == version
          models = json.loads(pathlib.Path('model-manifest.json').read_text())
          expected_models = {entry['file']: entry['sha256'] for entry in models['files']}
          for name in ('packaged-selftest.json', 'portable-selftest.json', 'installer-selftest.json'):
              report = json.loads((root / name).read_text())
              runtime = report['runtime'] if name == 'installer-selftest.json' else report
              assert runtime['frozen'] and runtime['model_version'] == models['version']
              assert runtime['model_files'] == expected_models
              assert runtime['browser_navigation_recovery'] is True
          checksums = dict(line.split('  ', 1)[::-1] for line in (root / 'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines() if line)
          with (root / 'Qorgau-Student.exe').open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == checksums['Qorgau-Student.exe']
          PY
          mkdir -p dist
          cp windows-artifacts/Qorgau-Student.exe dist/
      - name: Upload and activate the release
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.QORGAU_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.QORGAU_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          python scripts/prepare_teacher_faces.py --folder backend/proctor/assets/teacher-faces
          cp teacher-face-manifest.json backend/proctor/assets/teacher-faces/
          files=(backend shared deploy web/dist requirements-core.lock pyproject.toml)
          if [ -f dist/Qorgau-Student.exe ]; then files+=(dist/Qorgau-Student.exe); fi
          tar --exclude='__pycache__' --exclude='*.pyc' -czf release.tar.gz "${files[@]}"
          checksum=$(sha256sum release.tar.gz | cut -d ' ' -f1)
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer commit reached main while preparing the release; skipping.'
            exit 0
          fi
          ssh -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            qorgau-deploy@212.19.134.23 "deploy $GITHUB_SHA $checksum" < release.tar.gz
          echo "Deployed commit $GITHUB_SHA to https://212.19.134.23" >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Download and verify the exact trained runtime models
        run: |
          python scripts/prepare_models.py
          python scripts/prepare_teacher_faces.py
      - run: python -m pip install -r requirements-windows.lock -e '.[test,desktop,package,cv]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          QORGAU_TEST_INPUT_HOOKS: '1'
      - run: python scripts/prepare_licenses.py
      - run: python -m agent.client --self-test source-selftest.json
      - run: python scripts/build_student.py --with-cv --onedir
      - run: python scripts/build_student.py --with-cv
      - run: python scripts/build_student.py --with-cv --offline
      - name: Verify the actual packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Qorgau-Student/Qorgau-Student.exe' -ArgumentList '--self-test', "$pwd/packaged-selftest.json" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime check failed' }
          $report = Get-Content packaged-selftest.json | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Packaged report did not pass' }
          $process = Start-Process -FilePath 'dist/Qorgau-Student.exe' -ArgumentList '--self-test', "$pwd/portable-selftest.json" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Portable runtime check failed' }
          if ((Get-Content portable-selftest.json | ConvertFrom-Json).status -ne 'passed') { throw 'Portable report did not pass' }
          $process = Start-Process -FilePath 'dist/Qorgau-Offline.exe' -ArgumentList '--self-test', "$pwd/offline-selftest.json" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Offline runtime check failed' }
          $offline = Get-Content offline-selftest.json | ConvertFrom-Json
          if ($offline.status -ne 'passed' -or $offline.mode -ne 'offline' -or !$offline.teacher_face_runtime) { throw 'Offline report did not pass' }
      - name: Build Windows installer
        run: |
          Copy-Item packaged-selftest.json dist/Qorgau-Student/selftest.json
          python scripts/build_installer.py
      - name: Verify ordinary EXE first run without a classroom package
        run: python scripts/smoke_student_exe.py --plain --exe dist/Qorgau-Student.exe --output plain-first-run.json
      - name: Test installation, installed runtime, repair and removal
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          python scripts/test_installer.py --installer "artifacts/Qorgau-Student-Setup-$version-x64.exe"
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Qorgau-Student -DestinationPath Qorgau-Student-Windows-x64.zip
          Copy-Item dist/Qorgau-Student.exe artifacts/
          Copy-Item dist/Qorgau-Offline.exe artifacts/
          $files = @(Get-Item Qorgau-Student-Windows-x64.zip,dist/Qorgau-Student.exe,dist/Qorgau-Offline.exe) + @(Get-ChildItem artifacts/Qorgau-Student-Setup-*-x64.exe)
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Copy-Item Qorgau-Student-Windows-x64.zip,SHA256SUMS.txt,packaged-selftest.json,portable-selftest.json,offline-selftest.json,installer-selftest.json,plain-first-run.json artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: Qorgau-Student-Windows-x64
          path: artifacts/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-build-diagnostics
          path: |
            source-selftest.json
            packaged-selftest.json
            installer-selftest.json
            plain-first-run.json
            build/Qorgau-Student/warn-Qorgau-Student.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Qorgau-Student-Windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Qorgau-Web
          path: web-bundle
      - run: zip -r artifacts/Qorgau-Web.zip web-bundle
      - name: Publish verified hackathon prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --title "Qorgau $GITHUB_REF_NAME · Windows Installer" --notes-file docs/RELEASE_NOTES.md
