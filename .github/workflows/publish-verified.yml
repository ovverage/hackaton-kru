name: Publish an already verified Windows build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed run with successful verification and Windows packaging jobs
        required: true
        type: string
      tag:
        description: Version tag matching that build (vX.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require successful build jobs from this repository
        id: verified
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?filter=all&per_page=100" > job-pages.json
          python - <<'PY'
          import json, os, pathlib, re
          run = json.load(open('run.json'))
          jobs = {}
          for page in json.load(open('job-pages.json')):
              for job in page['jobs']:
                  old = jobs.get(job['name'])
                  if old is None or (job.get('run_attempt', 0), job['id']) > (old.get('run_attempt', 0), old['id']):
                      jobs[job['name']] = job
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/release.yml'
          assert run['status'] == 'completed'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          for name in ('verify', 'windows', 'server-face'):
              job = jobs[name]
              assert job['status'] == 'completed' and job['conclusion'] == 'success'
              assert job['head_sha'] == run['head_sha'] and job['run_id'] == run['id']
              assert isinstance(job['run_attempt'], int) and 1 <= job['run_attempt'] <= run['run_attempt']
          # A transfer timeout may leave deploy cancelled while all build jobs
          # passed. Record its actual state; independently verify the deployed
          # bytes below before allowing publication. There is no bypass input.
          proof = {'run': {key: run.get(key) for key in
                   ('id', 'head_sha', 'status', 'conclusion', 'run_attempt')},
                   'jobs': {name: {key: job.get(key) for key in
                            ('id', 'name', 'run_id', 'head_sha', 'run_attempt', 'status', 'conclusion')}
                            for name, job in jobs.items()},
                   'job_selection': 'Newest (run_attempt, id) for each name across every job page'}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'qorgau-verified-source.json').write_text(json.dumps(proof))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.sha }}
      - name: Download the verified artifacts and check version and checksums
        run: |
          gh run download "$SOURCE_RUN" --name Qorgau-Student-Windows-x64 --dir artifacts
          gh run download "$SOURCE_RUN" --name Qorgau-Server-Face-Runtime --dir artifacts
          gh run download "$SOURCE_RUN" --name Qorgau-Web --dir web-bundle
          python - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          expected = {'Qorgau-Student.exe', 'Qorgau-Offline.exe', 'Qorgau-Student-Windows-x64.zip', f'Qorgau-Student-Setup-{version}-x64.exe'}
          checked = set()
          for line in pathlib.Path('artifacts/SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name in expected and name not in checked
              with open(pathlib.Path('artifacts') / name, 'rb') as binary:
                  assert hashlib.file_digest(binary, 'sha256').hexdigest() == digest
              checked.add(name)
          assert checked == expected
          for name in ('packaged-selftest.json', 'portable-selftest.json', 'offline-selftest.json', 'installer-selftest.json', 'plain-first-run.json'):
              report = json.load(open('artifacts/' + name))
              assert report['status'] == 'passed' and report['version'] == version
          models = json.load(open('model-manifest.json'))
          expected_models = {entry['file']: entry['sha256'] for entry in models['files']}
          teacher_models = {entry['file']: entry['sha256'] for entry in json.load(open('teacher-face-manifest.json'))['files']}
          teacher_manifest = json.load(open('teacher-face-manifest.json'))
          server_face = json.load(open('artifacts/teacher-face-runtime.json'))
          assert server_face['status'] == 'passed' and server_face['platform'] == 'linux'
          assert server_face['python'].startswith('3.14.')
          assert server_face['backend_only_layout'] and server_face['fallback_manifest_loaded']
          assert server_face['blank_image_status'] == 422 and server_face['face_descriptor_shape'] == [1, 128]
          assert server_face['asset_sha256'] == {entry['file']: entry['sha256'] for entry in teacher_manifest['files'] + teacher_manifest['licenses']}
          for name in ('packaged-selftest.json', 'portable-selftest.json', 'offline-selftest.json', 'installer-selftest.json'):
              report = json.load(open('artifacts/' + name))
              runtime = report['runtime'] if name == 'installer-selftest.json' else report
              assert runtime['frozen'] and runtime['model_version'] == models['version']
              assert runtime['model_files'] == expected_models
              assert runtime['browser_navigation_recovery'] is True
              assert runtime['ui_languages'] == ['ru', 'kk', 'en']
              assert runtime['attention_warning_hold_seconds'] == 1.0
              assert runtime['attention_warning_fade_ms'] == 300
              assert runtime['attention_warning_native_stacking'] is True
              assert runtime['teacher_face_model_files'] == teacher_models and runtime['teacher_face_runtime']
              assert runtime['mode'] == ('offline' if name == 'offline-selftest.json' else 'online')
          PY
          zip -r artifacts/Qorgau-Web.zip web-bundle
      - name: Independently verify the live deployment and complete public EXE
        env:
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, tomllib, urllib.request
          base = 'https://212.19.134.23'
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          checksums = dict(line.split('  ', 1)[::-1] for line in
                           pathlib.Path('artifacts/SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines() if line)
          expected = checksums['Qorgau-Student.exe']
          expected_size = pathlib.Path('artifacts/Qorgau-Student.exe').stat().st_size
          headers = {'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity'}
          def get_json(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=120) as response:
                  assert response.status == 200
                  data = response.read(2 * 1024 * 1024 + 1)
                  assert len(data) <= 2 * 1024 * 1024
                  return json.loads(data)
          health = get_json('/api/health')
          assert health['status'] == 'ok' and health['version'] == version
          deployment = get_json('/deployment.json')
          assert deployment['commit'] == os.environ['VERIFIED_SHA']
          assert deployment['student_sha256'] == expected
          assert re.fullmatch('[0-9a-f]{64}', deployment['archive_sha256'])
          digest, size, magic = hashlib.sha256(), 0, b''
          with urllib.request.urlopen(urllib.request.Request(base + '/api/student/download', headers=headers), timeout=120) as response:
              assert response.status == 200
              while block := response.read(1024 * 1024):
                  if not magic:
                      magic = block[:2]
                  size += len(block)
                  assert size <= expected_size
                  digest.update(block)
          assert size == expected_size and magic == b'MZ' and digest.hexdigest() == expected
          assert get_json('/deployment.json') == deployment
          after = get_json('/api/health')
          assert after['status'] == 'ok' and after['version'] == version
          source = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'qorgau-verified-source.json').read_text())
          proof = {'status': 'passed', 'version': version, 'source_commit': os.environ['VERIFIED_SHA'],
                   'source_run': int(os.environ['SOURCE_RUN']), 'build_evidence': source,
                   'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'deployment': deployment, 'public_exe': {'url': base + '/api/student/download',
                   'bytes': size, 'sha256': digest.hexdigest(), 'magic_hex': magic.hex()},
                   'tls_verification': 'Default certificate and hostname validation',
                   'scope': 'Successful build jobs plus independent live HTTPS deployment verification; source deploy job status is preserved.'}
          pathlib.Path('artifacts/public-deployment-verification.json').write_text(json.dumps(proof, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              deploy = source['jobs'].get('deploy', {})
              summary.write(f"Verified live {version}, commit {proof['source_commit']}, complete EXE SHA256 {expected}. "
                            f"Source CI deploy conclusion: {deploy.get('conclusion', 'not present')}.\n")
          PY
      - name: Tag and publish that exact commit
        env:
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [ -n "$existing" ]; then
            test "$existing" = "$VERIFIED_SHA"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$VERIFIED_SHA"
          fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "Qorgau $RELEASE_TAG · Windows Installer" --notes-file docs/RELEASE_NOTES.md
